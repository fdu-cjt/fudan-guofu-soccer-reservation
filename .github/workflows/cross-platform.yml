name: Cross-platform tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v9
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chrome
      - run: uv run --locked python -B tests/test_soccer.py
      - run: uv run --locked python -B tests/test_soccer_retry.py
      - run: uv run --locked python -B tests/test_soccer_browser.py
